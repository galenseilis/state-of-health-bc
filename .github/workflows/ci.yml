name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Build package
        run: uv build --out-dir dist

      - name: Smoke-test the installed wheel
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/sohbc" --version
          "$RUNNER_TEMP/smoke/bin/sohbc" validate
          cd "$RUNNER_TEMP"
          SOHBC_ROOT="$GITHUB_WORKSPACE" "$RUNNER_TEMP/smoke/bin/sohbc" validate
          SOHBC_ROOT="$GITHUB_WORKSPACE" "$RUNNER_TEMP/smoke/bin/python" -c "from sohbc import load; print(len(load()), 'sources')"
          if "$RUNNER_TEMP/smoke/bin/sohbc" validate; then
            echo "expected a failure outside a project checkout" >&2
            exit 1
          fi
