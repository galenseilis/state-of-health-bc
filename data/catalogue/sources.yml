# Data source catalogue for State-of-Health BC (milestone M2).
#
# This file is the machine-readable source of truth for the acquisition
# pipeline (`python -m sohbc`). The human-readable version is
# reference/data-sources.qmd; the data quality report is
# reference/data-quality.qmd.
#
# "Data" is construed broadly (roadmap M2): microdata, indicator tables,
# dashboards, report figures, and APIs all qualify. Nothing individual-level
# is committed to the repository.
#
# Schema (per source):
#   key             stable identifier, used for filenames and CLI arguments
#   title           human-readable name
#   publisher       organisation responsible for the source
#   url             canonical landing page (verified reachable)
#   citation        optional key in references.bib
#   form            microdata | indicator_table | dashboard | report_figure | api | catalogue
#   domains         list of M1 domains, or [External driver]
#   indicators      indicator families this source can back
#   resolution      list of: individual, neighbourhood, hsda, health_authority, provincial, international
#   geography       spatial scope as published
#   coverage        temporal coverage as published (verify at ingest)
#   frequency       monthly | quarterly | annual | irregular
#   refresh         refresh cadence as published
#   licence         licence / terms
#   access          public | registration | request
#   form_of_access  how you actually get it
#   origin          bc | canada | international
#   reaches_bc_via  mechanism by which an external source reaches BC (external drivers only)
#   temporal_behaviour  trending | seasonal | shock_prone | stable
#   quality_notes   known caveats, suppressions, revisions
#   download        {kind: manual|direct|api_json, url, filename}
schema_version: 1

