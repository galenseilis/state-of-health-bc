[project]
name = "sohbc"
version = "0.1.0"
description = "Acquisition and analysis tooling for the State-of-Health BC project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "griffe>=0.38.0,<0.47.0",
  "PyYAML>=6.0",
  "quartodoc>=0.7.6,<0.9.0",
  "requests>=2.31",
]

[project.scripts]
sohbc = "sohbc.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
